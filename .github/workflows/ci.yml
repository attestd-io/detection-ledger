name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parity:
    name: Ledger index parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate ledger.json against incident files
        run: python3 scripts/validate_ledger.py
